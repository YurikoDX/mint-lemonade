[package]
name = "mint-lemonade"
version = "0.1.0"
edition = "2024"
description = "An indie game made with Bevy"
license = "GPL-3.0-only"

[features]
fast-dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "2d",
    "ui",
    "multi_threaded",
    "x11",
    "wayland",
] }
bevy_kira_audio = { version = "0.26.0", features = ["mp3", "wav"] }
rand = "0.9"
rand_chacha = "0.9"
ron = "0.12.1"
thiserror = "2.0.18"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
